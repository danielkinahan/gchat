services:
  api:
    build:
      context: .
      dockerfile: Containerfile.api
    env_file: .env
    volumes:
      - ./data:/data:ro
      - ./config:/config:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Containerfile.web
    ports:
      - "3000:80"
    env_file: .env
    depends_on:
      - api

