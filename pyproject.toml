[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gchat"
version = "0.1.0"
description = "Self-hosted multi-platform chat analytics ingest pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.1",
  "PyYAML>=6.0",
]

[project.scripts]
gchat-build = "gchat.cli:main"
gchat-copy-facebook-groups = "gchat.facebook_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
