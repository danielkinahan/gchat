[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gchat"
version = "0.1.0"
description = "Self-hosted multi-platform chat analytics ingest pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "duckdb>=1.1",
  "PyYAML>=6.0",
  "httpx2>=0.0.1",
  "uvicorn>=0.30",
]

[project.scripts]
gchat-build = "gchat.cli:main"
gchat-api = "gchat.api:main"
gchat-copy-facebook-groups = "gchat.facebook_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gchat = ["data/*.txt"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.18",
]
