# Message IDs to exclude from language and word-count statistics.
#
# Messages listed here are hidden from:
#   - Language tab  (word frequency, word breakdown, word examples)
#   - Messages tab  (message count and word count metrics)
#
# They still appear normally in the chat context window and search.
#
# How to find a message ID:
#   1. Find the message via Search tab and click "Show in context"
#   2. Copy the message_id value from the URL bar
#
# Example:
# - a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2
