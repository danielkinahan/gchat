server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so the upstream IP is re-resolved
    # after the API container is recreated (avoids "Host is unreachable").
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The restart endpoint is internal to the docker network (called by the
    # scheduler to recycle the API after a rebuild). Reject any external
    # caller so it isn't a public DoS vector.
    location = /api/restart {
        return 404;
    }

    location /api/ {
        # Variable assignment forces nginx to use the resolver at request time.
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
