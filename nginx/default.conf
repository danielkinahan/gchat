server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The restart endpoint is internal to the docker network (called by the
    # scheduler to recycle the API after a rebuild). Reject any external
    # caller so it isn't a public DoS vector.
    location = /api/restart {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
